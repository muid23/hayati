services:
  - type: web
    name: hayati-one-health
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn hayati:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
